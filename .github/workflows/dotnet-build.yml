name: Build RaceDay Part 2
on:
  push:
    branches: [main, feat/identity-foundation]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/RaCeDay/RaCeDay.csproj
      - name: Build
        run: dotnet build src/RaCeDay/RaCeDay.csproj --no-restore -c Release --warnaserror
